<!-- Apply the saved theme before first paint to avoid a flash -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('linkbox:theme');
      var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
</script>

<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #15181e; --mute: #667085;
    --line: #e2e5ea; --soft: #eceef2; --accent: #4f46e5; --accent-ink: #ffffff;
  }
  .dark {
    --bg: #0f1115; --surface: #171a20; --ink: #eceef2; --mute: #9aa1ad;
    --line: #272b34; --soft: #1f232b; --accent: #8b9cff; --accent-ink: #0f1115;
  }
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); font-family: 'Heebo', system-ui, sans-serif; }
  .mute { color: var(--mute); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  /* subtle edge fade = a visual hint that these rows scroll sideways (mouse wheel now works on them too) */
  .no-scrollbar { -webkit-mask-image: linear-gradient(to right, transparent, #000 20px, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(to right, transparent, #000 20px, #000 calc(100% - 20px), transparent); }

  .field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
           padding: .6rem .8rem; color: var(--ink); font: inherit; }
  .field::placeholder { color: var(--mute); }
  .field-sm { width: auto; max-width: 62%; padding: .3rem .5rem; font-size: .8rem; border-radius: 10px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: 12px;
         padding: .6rem 1.1rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; font-family: inherit; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }

  .icon-btn { width: 2.25rem; height: 2.25rem; display: inline-flex; align-items: center; justify-content: center;
              border-radius: 10px; color: var(--mute); border: 1px solid transparent; cursor: pointer; background: transparent; }
  .icon-btn:hover { background: var(--soft); color: var(--ink); }
  .icon-btn[aria-pressed="true"] { color: #f59e0b; }
  .icon-btn svg { width: 1.15rem; height: 1.15rem; }

  .chip { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
          border-radius: 999px; padding: .35rem .85rem; font-size: .875rem; font-weight: 500; cursor: pointer; font-family: inherit; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .count { opacity: .6; font-size: .75rem; margin-inline-start: .3rem; }
  .chip-add { border-style: dashed; color: var(--mute); }

  .icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
  .btn-danger { background: #dc2626; color: #fff; }

  .dlg { margin: auto; padding: 0; width: min(560px, calc(100vw - 1.5rem)); max-height: min(88vh, 720px);
         background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .dlg[open] { display: flex; flex-direction: column; }
  .dlg::backdrop { background: rgba(8, 10, 14, .55); }
  .trow { display: flex; align-items: center; gap: .25rem; padding: .45rem 1rem; border-bottom: 1px solid var(--line); }
  .trow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .trow-del { padding: .9rem 1rem; border-bottom: 1px solid var(--line); background: var(--soft); }
  .emoji-pick button { font-size: 1.2rem; width: 2.1rem; height: 2.1rem; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; }
  .emoji-pick button:hover { background: var(--soft); }
  .trow .icon-btn { width: 1.9rem; height: 1.9rem; }
  .icon-btn[data-tact="share"][aria-pressed="true"] { color: var(--accent); }
  .icon-btn[data-act="done"][aria-pressed="true"] { color: #16a34a; }
  .icon-btn[data-view][aria-pressed="true"] { background: var(--soft); color: var(--ink); }
  .btn-sm { padding: .35rem .75rem; font-size: .8rem; border-radius: 10px; }

  /* list view: the grid becomes a vertical stack, and each card's thumb shrinks to sit beside the title
     instead of on top of it. Nothing else about a card changes, so every action still works exactly the same. */
  #grid.list-view { display: flex; flex-direction: column; gap: .5rem; }
  #grid.list-view .card > a { display: flex; align-items: center; gap: .75rem; }
  #grid.list-view .thumb { width: 4rem; height: 4rem; aspect-ratio: 1; flex: none; border-radius: 10px; }
  #grid.list-view .thumb .badge { display: none; }
  #grid.list-view .card > a > div.px-4.pt-3 { padding: 0; }
  #grid.list-view .card > a p.line-clamp-2 { display: none; }
  #grid.list-view .card h3 { -webkit-line-clamp: 1; font-size: .9rem; }

  .tagchip { font-size: .72rem; padding: .15rem .55rem; border-radius: 999px; background: var(--soft); color: var(--mute);
             border: 1px solid transparent; cursor: pointer; font-family: inherit; }
  .tagchip:hover { background: var(--line); color: var(--ink); }

  .card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .card { position: relative; }
  .select-box { position: absolute; top: .5rem; inset-inline-end: .5rem; z-index: 5; width: 1.7rem; height: 1.7rem; border-radius: 7px;
                background: rgba(15, 17, 21, .55); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .select-box input { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); cursor: pointer; }

  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--soft); overflow: hidden; }
  .thumb img, .thumb .ph { position: absolute; inset: 0; width: 100%; height: 100%; }
  .thumb img { object-fit: cover; }
  .thumb .ph { display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700;
               color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--soft)); }
  .badge { position: absolute; top: .5rem; inset-inline-start: .5rem; display: inline-flex; align-items: center; gap: .35rem;
           background: rgba(15, 17, 21, .74); color: #fff; border-radius: 999px; padding: .15rem .6rem; font-size: .75rem;
           backdrop-filter: blur(6px); }
  .badge i { width: .5rem; height: .5rem; border-radius: 999px; display: inline-block; }

  .skel { background: linear-gradient(90deg, var(--soft), var(--line), var(--soft)); background-size: 200% 100%;
          animation: sh 1.2s linear infinite; border-radius: 8px; }
  @keyframes sh { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>

<script type="module">
/* =====================================================================
   1. Firebase config – paste yours here (see README.md).
      While it still says YOUR_..., the app runs locally on localStorage.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCbhE_tGUCT3SPzQvCi5XPMy43hed1gDW8",
  authDomain: "linkbox-pro.firebaseapp.com",

/* =====================================================================
   2. Helpers
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : '');
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };

// Share links carry tracking params that make the same post look like a "new" link every time
// (Instagram's igsh, TikTok's _r/_t, a YouTube si= id, utm_* on almost anything...). This builds a
// canonical key for COMPARISON only — the link people actually save keeps its real, original URL.
const DEDUPE_STRIP_UNIVERSAL = new Set(['fbclid', 'gclid', 'gclsrc', 'dclid', 'msclkid', 'yclid', 'mc_cid', 'mc_eid', 'ref', 'ref_src', 'spm', 'igshid', 'igsh']);
const DEDUPE_STRIP_BY_HOST = {
  'instagram.com': ['igsh', 'igshid', 'img_index'],
  'tiktok.com': ['_r', '_t', 'is_from_webapp', 'sender_device', 'sender_web_id', 'web_id', 'checksum'],
  'youtube.com': ['si', 'feature', 'app', 't'],
  'youtu.be': ['si', 'feature', 'app', 't'],
  'twitter.com': ['s', 't'],
  'x.com': ['s', 't'],
  'facebook.com': ['mibextid', 'rdid', 'wtsid'],
  'fb.watch': ['mibextid'],
};
function normalizeForDedupe(urlStr) {
  let u;
  try { u = new URL(urlStr); } catch { return String(urlStr || '').trim().toLowerCase(); }
  const host = u.hostname.replace(/^www\./, '').toLowerCase();
  const strip = new Set(DEDUPE_STRIP_UNIVERSAL);
  for (const [h, params] of Object.entries(DEDUPE_STRIP_BY_HOST)) {
    if (host === h || host.endsWith('.' + h)) params.forEach((p) => strip.add(p));
  }
  const kept = [...u.searchParams.entries()]
    .filter(([k]) => !strip.has(k) && !k.toLowerCase().startsWith('utm_'))
    .sort((a, b) => a[0].localeCompare(b[0]));
  const qs = kept.map(([k, v]) => `${k}=${v}`).join('&');
  const path = u.pathname.replace(/\/+$/, '') || '/';
  return `${host}${path}${qs ? '?' + qs : ''}`.toLowerCase();
}
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const DEFAULT_TOPICS = ['🎸 גיטרה', '🎵 שירים ללמוד', '🎙️ ציוד', '💡 רעיונות', '🔥 השראה'];

const PLATFORMS = [
  { re: /(^|\.)youtube\.com$|^youtu\.be$/, name: 'YouTube', color: '#ef4444' },
  { re: /(^|\.)instagram\.com$/, name: 'Instagram', color: '#ec4899' },
  { re: /(^|\.)tiktok\.com$/, name: 'TikTok', color: '#14b8a6' },
  { re: /(^|\.)(x|twitter)\.com$/, name: 'X', color: '#71717a' },
  { re: /(^|\.)facebook\.com$|^fb\.watch$/, name: 'Facebook', color: '#3b82f6' },
  { re: /(^|\.)reddit\.com$/, name: 'Reddit', color: '#f97316' },
  { re: /(^|\.)spotify\.com$/, name: 'Spotify', color: '#22c55e' },
];
function platformOf(url) {
  const h = hostOf(url);
  return PLATFORMS.find((p) => p.re.test(h)) || { name: h || 'קישור', color: '#6366f1' };
}

let toastTimer;
function toast(msg, action) {
  if (!msg) return;
  const btn = action ? `<button type="button" id="toastAction" style="color:var(--bg);font-weight:700;text-decoration:underline;background:none;border:none;padding:0;margin-inline-start:.85rem;cursor:pointer;font:inherit">${esc(action.label)}</button>` : '';
  el.toast.innerHTML = `<div class="rounded-xl px-4 py-2.5 text-sm font-medium shadow-lg flex items-center" style="background:var(--ink);color:var(--bg)">${esc(msg)}${btn}</div>`;
  if (action) $('#toastAction').addEventListener('click', () => { clearTimeout(toastTimer); el.toast.innerHTML = ''; action.onClick(); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.toast.innerHTML = ''), action ? 6500 : 3800);
}
async function safe(fn) {
  try { await fn(); } catch (e) { console.error(e); toast('משהו השתבש. נסה שוב.'); }
}

/* =====================================================================
   3. State
   ===================================================================== */
let store = null;          // current data layer (local or cloud)
let links = [];            // newest first
let savedTopics = null;    // the user's own ordered topic list (null = never customised, use defaults)
let legacyTopics = [];     // extra topics saved by earlier versions of the app
let loaded = false;
let activeTopic = 'all';   // 'all' | '__none__' | <topic name>
let graceTopic = null;     // a topic being renamed right now, allowed to stay selected until the new list arrives
let searchText = '';
let pending = null;        // link being previewed before save
let busy = false;

// second filter layer, all scoped within the active topic
let activePlatform = null; // e.g. 'YouTube', or null for all platforms
let favOnly = false;
let doneOnly = false;
let activeTags = new Set();
let sortMode = 'new';      // 'new' | 'old' | 'az'
let viewMode = 'grid';     // 'grid' | 'list' – a device preference, kept in localStorage regardless of account type
try { viewMode = localStorage.getItem('linkbox:view') === 'list' ? 'list' : 'grid'; } catch {}
let editingId = null;      // id of the card whose note/tags are being edited inline

// multi-select (bulk move/delete)
let selectMode = false;
let selectedIds = new Set();

// sharing (cloud accounts only)
let activeShares = [];         // [{ topic, shareId }] – this user's currently-shared topics
let shareSnapshotCache = {};   // shareId -> last JSON written, to skip redundant writes
let shareSyncTimer = null;

const NONE = '__none__';            // tab key for links without a topic
const NONE_LABEL = 'ללא נושא';

const allTopics = () => {
  if (savedTopics) return savedTopics;
  const out = [...DEFAULT_TOPICS];
  for (const t of [...legacyTopics, ...links.map((l) => l.topic)]) if (t && !out.includes(t)) out.push(t);
  return out;
};
const isOrphan = (l) => !allTopics().includes(l.topic);   // no topic, or its topic no longer exists
const defaultTopic = () => (allTopics().includes(activeTopic) ? activeTopic : allTopics()[0] || '');
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();

// "🎸 גיטרה" <-> { emoji: "🎸", name: "גיטרה" }
const EMOJI_HEAD = /^((?:\p{Extended_Pictographic}[\uFE0F\u200D]*)+)\s*(.*)$/u;
function splitTopic(t) { const m = EMOJI_HEAD.exec(t); return m ? { emoji: m[1], name: m[2] } : { emoji: '', name: t }; }
const joinTopic = (emoji, name) => (emoji ? emoji + ' ' + name : name);

function topicSelectOptions(selected) {
  const sel = allTopics().includes(selected) ? selected : '';
  return [...allTopics().map((t) => ({ v: t, l: t })), { v: '', l: NONE_LABEL }]
    .map((o) => `<option value="${esc(o.v)}"${o.v === sel ? ' selected' : ''}>${esc(o.l)}</option>`).join('');
}

// switching topics (by hand or automatically, e.g. after a delete) clears the finer filters – they're scoped to the topic
function resetTopic(k) { activeTopic = k; activePlatform = null; activeTags = new Set(); favOnly = false; doneOnly = false; }

function topicScopedLinks() {
  return links.filter((l) => (activeTopic === NONE ? isOrphan(l) : activeTopic === 'all' || l.topic === activeTopic));
}

// "כלים, מתחילים" -> ["כלים", "מתחילים"]; trims, drops '#', dedupes case-insensitively, caps count/length
function parseTags(raw) {
  const seen = new Set();
  const out = [];
  for (let t of String(raw || '').split(/[,\n]+/)) {
    t = t.trim().replace(/^#+/, '').slice(0, 24);
    if (!t) continue;
    const k = t.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(t);
    if (out.length >= 8) break;
  }
  return out;
}

/* ---- sharing ---- */
function genShareId() { return crypto.randomUUID().replace(/-/g, ''); }
function shareUrlFor(id) {
  const u = new URL(location.href);
  u.search = '?share=' + id;
  u.hash = '';
  return u.href;
}
// the public-safe projection of one topic's links – no uid, no internal ids, no tags/notes
function buildShareSnapshot(topic) {
  return links.filter((l) => l.topic === topic).slice(0, 300).map((l) => ({
    url: l.url,
    title: l.title || hostOf(l.url),
    description: l.description || '',
    image: safeUrl(l.image).replace(/^http:/i, 'https:'),
    site: platformOf(l.url).name,
    createdAt: l.createdAt || 0,
  }));
}
// re-publishes every active share whose content actually changed, a moment after the links settle
function scheduleShareSync() {
  if (!store || !store.canShare || !activeShares.length) return;
  clearTimeout(shareSyncTimer);
  shareSyncTimer = setTimeout(() => {
    for (const { topic, shareId } of activeShares) {
      const snap = buildShareSnapshot(topic);
      const key = JSON.stringify(snap);
      if (shareSnapshotCache[shareId] === key) continue;
      shareSnapshotCache[shareId] = key;
      safe(() => store.writeShareSnapshot(shareId, topic, snap));
    }
  }, 500);
}

/* =====================================================================
   4. Data layers – same interface: start / stop / add / update / remove / applyTopics
   ===================================================================== */
function makeLocalStore(onLinks, onTopics) {
  const read = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  let list = read('linkbox:links', []);
  const legacy = read('linkbox:topics', []);
  let saved = read('linkbox:topicList', null);
  const persist = () => {
    try {
      localStorage.setItem('linkbox:links', JSON.stringify(list));
      localStorage.setItem('linkbox:topicList', JSON.stringify(saved));
    } catch {}
    onLinks([...list].sort((a, b) => b.createdAt - a.createdAt));
  };
  return {
    canShare: false,   // sharing needs a public backend, which local (Firebase-less) mode doesn't have
    start() { persist(); onTopics({ list: saved, legacy, shares: [] }); },
    stop() {},
    async add(l) { list.push({ ...l, fav: false, id: uid8(), createdAt: Date.now() }); persist(); },
    async update(id, patch) { list = list.map((x) => (x.id === id ? { ...x, ...patch } : x)); persist(); },
    async remove(id) { list = list.filter((x) => x.id !== id); persist(); },
    // Saves the topic list; `remap` = { from, to } also moves every link of one topic to another.
    async applyTopics(newList, remap) {
      if (remap) list = list.map((x) => (x.topic === remap.from ? { ...x, topic: remap.to } : x));
      saved = newList;
      persist();
      onTopics({ list: saved, legacy, shares: [] });
    },
  };
}

function makeCloudStore(fb, uid, onLinks, onTopics) {
  const { db, F } = fb;
  let unsubLinks = () => {};
  let unsubTopics = () => {};
  let current = [];   // latest links, used to find which ones a topic change affects
  const toList = (snap) =>
    snap.docs
      .map((d) => { const x = d.data(); return { id: d.id, ...x, createdAt: x.createdAt?.toMillis?.() ?? Date.now() }; })
      .sort((a, b) => b.createdAt - a.createdAt);

  return {
    start() {
      const col = F.collection(db, 'links');
      const plain = F.query(col, F.where('uid', '==', uid));
      const ordered = F.query(col, F.where('uid', '==', uid), F.orderBy('createdAt', 'desc'));
      const onErr = (e) => {
        console.error(e);
        toast(e.code === 'permission-denied' ? 'אין הרשאה לקרוא נתונים. בדוק את חוקי Firestore (ראה README).' : 'טעינת הקישורים נכשלה.');
      };
      unsubLinks = F.onSnapshot(ordered, (s) => onLinks((current = toList(s))), (e) => {
        if (e.code === 'failed-precondition') {
          // Composite index missing – keep working (sorted on the client) and print the index link in the console.
          console.warn('Missing Firestore index (uid + createdAt). Create it with the link below:', e.message);
          unsubLinks = F.onSnapshot(plain, (s) => onLinks((current = toList(s))), onErr);
        } else onErr(e);
      });
      unsubTopics = F.onSnapshot(F.doc(db, 'users', uid), (s) => {
        const d = s.data() || {};
        onTopics({
          list: Array.isArray(d.topicList) ? d.topicList : null,
          legacy: Array.isArray(d.topics) ? d.topics : [],
          shares: Array.isArray(d.shares) ? d.shares : [],
        });
      }, (e) => console.warn(e));
    },
    stop() { unsubLinks(); unsubTopics(); },
    canShare: true,
    async add(l) { await F.addDoc(F.collection(db, 'links'), { uid, ...l, fav: false, createdAt: F.serverTimestamp() }); },
    async update(id, patch) { await F.updateDoc(F.doc(db, 'links', id), patch); },
    async remove(id) { await F.deleteDoc(F.doc(db, 'links', id)); },
    // Saves the topic list and, if `remap` is given, moves the affected links in the same batch(es).
    // Firestore allows 500 writes per batch, so big moves are split.
    async applyTopics(newList, remap) {
      const ids = remap ? current.filter((l) => l.topic === remap.from).map((l) => l.id) : [];
      const CHUNK = 400;
      let i = 0;
      do {
        const batch = F.writeBatch(db);
        if (i === 0) batch.set(F.doc(db, 'users', uid), { topicList: newList }, { merge: true });
        for (const id of ids.slice(i, i + CHUNK)) batch.update(F.doc(db, 'links', id), { topic: remap.to });
        await batch.commit();
        i += CHUNK;
      } while (i < ids.length);
    },
    // Replaces the whole shares list (like applyTopics does for topics) – small array, simplest as one write.
    async setShares(newShares) { await F.setDoc(F.doc(db, 'users', uid), { shares: newShares }, { merge: true }); },
    async writeShareSnapshot(shareId, topic, snap) {
      await F.setDoc(F.doc(db, 'sharedTopics', shareId), { uid, topic, links: snap, updatedAt: F.serverTimestamp() });
    },
    async deleteShareSnapshot(shareId) { await F.deleteDoc(F.doc(db, 'sharedTopics', shareId)); },
  };
}

function useStore(s) {
  if (store) store.stop();
  store = s;
  links = []; savedTopics = null; legacyTopics = []; activeShares = []; shareSnapshotCache = {}; loaded = false;
  render();
  if (s) s.start();
}
const onLinks = (list) => {
  links = list; loaded = true; render(); renderManagerList(); scheduleShareSync();
  if (pendingShareTarget) {
    const url = pendingShareTarget; pendingShareTarget = null;
    el.url.value = url;
    el.form.requestSubmit ? el.form.requestSubmit() : el.form.dispatchEvent(new Event('submit', { cancelable: true }));
  }
};
const onTopics = ({ list, legacy, shares }) => {
  savedTopics = list; legacyTopics = legacy || []; activeShares = Array.isArray(shares) ? shares : [];
  render(); renderManagerList(); refreshPreviewTopics(); scheduleShareSync();
};

/* =====================================================================
   5. Rendering
   ===================================================================== */
function render() { renderTabs(); renderFilterBar(); renderGrid(); }
function renderFacets() { renderFilterBar(); renderGrid(); }   // a finer filter changed; the topic tabs themselves didn't

function renderTabs() {
  const counts = {};
  links.forEach((l) => (counts[l.topic] = (counts[l.topic] || 0) + 1));
  const orphans = links.filter(isOrphan).length;
  // the selected topic may have just been renamed/deleted (here or on another device)
  if (activeTopic === NONE ? !orphans : activeTopic !== 'all' && !allTopics().includes(activeTopic) && activeTopic !== graceTopic) resetTopic('all');
  const tabs = [
    { k: 'all', label: 'הכל', n: links.length },
    ...allTopics().map((t) => ({ k: t, label: t, n: counts[t] || 0 })),
    ...(orphans ? [{ k: NONE, label: NONE_LABEL, n: orphans }] : []),
  ];
  el.tabs.innerHTML =
    tabs.map((t) => `<button class="chip" data-tab="${esc(t.k)}" aria-pressed="${t.k === activeTopic}">${esc(t.label)}<span class="count">${t.n}</span></button>`).join('') +
    `<button class="chip chip-add" data-act="manageTopics">ניהול נושאים</button>`;
}

function renderFilterBar() {
  if (!loaded) { el.filterBar.innerHTML = ''; return; }
  const scoped = topicScopedLinks();
  const platCounts = {};
  scoped.forEach((l) => { const n = platformOf(l.url).name; platCounts[n] = (platCounts[n] || 0) + 1; });
  const platNames = Object.keys(platCounts).sort((a, b) => platCounts[b] - platCounts[a]);
  const tagCounts = {};
  scoped.forEach((l) => (l.tags || []).forEach((t) => (tagCounts[t] = (tagCounts[t] || 0) + 1)));
  const tagNames = Object.keys(tagCounts).sort((a, b) => a.localeCompare(b, 'he'));
  const favN = scoped.filter((l) => l.fav).length;
  const doneN = scoped.filter((l) => l.done).length;
  const anyFilter = activePlatform || favOnly || doneOnly || activeTags.size;

  const row1 = `<div class="flex items-center gap-2">
    <div class="no-scrollbar flex-1 min-w-0 flex gap-2 overflow-x-auto pb-1">
      <button type="button" class="chip" data-act="favOnly" aria-pressed="${favOnly}">★ מועדפים<span class="count">${favN}</span></button>
      <button type="button" class="chip" data-act="doneOnly" aria-pressed="${doneOnly}">✓ בוצע<span class="count">${doneN}</span></button>
      ${platNames.length > 1 ? platNames.map((n) => `<button type="button" class="chip" data-plat="${esc(n)}" aria-pressed="${activePlatform === n}">${esc(n)}<span class="count">${platCounts[n]}</span></button>`).join('') : ''}
      ${anyFilter ? `<button type="button" class="chip chip-add" data-act="clearFilters">נקה סינון</button>` : ''}
    </div>
    <select id="sortSelect" class="field field-sm flex-none" aria-label="מיון">
      <option value="new"${sortMode === 'new' ? ' selected' : ''}>חדש קודם</option>
      <option value="old"${sortMode === 'old' ? ' selected' : ''}>ישן קודם</option>
      <option value="az"${sortMode === 'az' ? ' selected' : ''}>א-ב</option>
    </select>
  </div>`;

  const row2 = tagNames.length
    ? `<div class="no-scrollbar flex gap-2 overflow-x-auto pb-1">
        ${tagNames.map((t) => `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${activeTags.has(t)}">#${esc(t)}<span class="count">${tagCounts[t]}</span></button>`).join('')}
      </div>`
    : '';

  el.filterBar.innerHTML = row1 + row2;
}

function sortLinks(list) {
  const arr = [...list];
  if (sortMode === 'old') arr.sort((a, b) => a.createdAt - b.createdAt);
  else if (sortMode === 'az') arr.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'he'));
  return arr; // 'new' – links already arrive newest-first from the store
}

function renderGrid() {
  el.grid.classList.toggle('list-view', viewMode === 'list');
  if (!loaded) {
    el.empty.classList.add('hidden');
    el.grid.innerHTML = Array.from({ length: 3 }, () =>
      `<div class="card"><div class="thumb skel" style="border-radius:0"></div><div class="space-y-2 p-4"><div class="skel h-4 w-3/4"></div><div class="skel h-3 w-full"></div></div></div>`).join('');
    return;
  }
  let shown = topicScopedLinks();
  const q = searchText.trim().toLowerCase();
  if (q) shown = shown.filter((l) => [l.title, l.description, l.url, l.topic, ...(l.tags || [])].some((v) => (v || '').toLowerCase().includes(q)));
  if (activePlatform) shown = shown.filter((l) => platformOf(l.url).name === activePlatform);
  if (favOnly) shown = shown.filter((l) => l.fav);
  if (doneOnly) shown = shown.filter((l) => l.done);
  if (activeTags.size) shown = shown.filter((l) => (l.tags || []).some((t) => activeTags.has(t)));
  shown = sortLinks(shown);

  el.grid.innerHTML = shown.map(cardHTML).join('');
  el.empty.classList.toggle('hidden', shown.length > 0);
  el.empty.textContent = links.length === 0
    ? 'עוד אין קישורים. הדבק קישור בשדה למעלה כדי לשמור את הראשון.'
    : 'לא נמצאו קישורים שמתאימים לסינון.';
}

/* =====================================================================
   6. Adding a link
   ===================================================================== */
async function fetchPreview(url) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch('/.netlify/functions/preview?url=' + encodeURIComponent(url), { signal: ctl.signal });
    if (!r.ok) throw new Error('preview http ' + r.status);
    if (!(r.headers.get('content-type') || '').includes('json')) throw new Error('preview is not json'); // plain static server
    return await r.json();
  } finally { clearTimeout(timer); }
}

el.form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy || !store) return;
  const raw = el.url.value.trim();
  if (!raw) return;

  // Share sheets often paste "text + link" – take the first URL in the text.
  let url = (raw.match(/https?:\/\/[^\s]+/i) || [raw])[0];
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try {
    const u = new URL(url);
    if (!u.hostname.includes('.')) throw new Error('bad host');
    url = u.href;
  } catch { return toast('הקישור לא נראה תקין. בדוק ונסה שוב.'); }

  const dup = links.find((l) => normalizeForDedupe(l.url) === normalizeForDedupe(url));
  if (dup) return toast(dup.topic ? `הקישור הזה כבר שמור אצלך בנושא "${dup.topic}".` : 'הקישור הזה כבר שמור אצלך.');

  busy = true; el.btnAdd.disabled = true;
  pending = { loading: true, url };
  renderPreview();
  try {
    const d = await fetchPreview(url);
    pending = {
      url, title: d.title || hostOf(url), description: d.description || '', image: d.image || '',
      topic: defaultTopic(), weak: d.source === 'fallback',
    };
  } catch (err) {
    console.warn('preview failed:', err);
    pending = { url, title: hostOf(url), description: '', image: '', topic: defaultTopic(), weak: true };
  }
  busy = false; el.btnAdd.disabled = false;
  renderPreview();
});

el.panel.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || !pending) return;
  if (b.dataset.act === 'cancel') { pending = null; renderPreview(); }
  if (b.dataset.act === 'save') safe(async () => {
    const link = {
      url: pending.url,
      title: $('#pvTitle').value.trim() || hostOf(pending.url),
      description: $('#pvDesc').value.trim(),
      image: pending.image,
      topic: $('#pvTopic').value,
      tags: parseTags($('#pvTags').value),
      note: $('#pvNote').value.trim().slice(0, 200),
      done: false,
    };
    await store.add(link);
    pending = null; el.url.value = '';
    renderPreview();
    toast('נשמר.');
  });
});

  if (b.dataset.act === 'done') {
    const l = links.find((x) => x.id === id);
    if (l) safe(() => store.update(id, { done: !l.done }));
  }
  if (b.dataset.act === 'del' && confirm('למחוק את הקישור?')) safe(() => store.remove(id));
  if (b.dataset.act === 'edit') { editingId = editingId === id ? null : id; renderGrid(); }

// keeps an open preview's topic list in sync when topics change, without touching what was typed
function refreshPreviewTopics() {
  const sel = $('#pvTopic');

  sel.innerHTML = topicSelectOptions(pending.topic);

el.topicForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('#tfName').value.trim();
  if (!name) return toast('כתוב שם לנושא.');
  const full = joinTopic($('#tfEmoji').value.trim(), name);
  const topics = allTopics();
  const old = mgr.editing;

  if (old === null) {
    if (topics.some((t) => sameName(t, full))) return toast('נושא בשם הזה כבר קיים.');
    safe(async () => {
      await store.applyTopics([...topics, full]);
      mgr.editing = null; renderManagerForm();
      $('#tfName').focus();
      toast('הנושא נוסף.');
    });
  } else {
    if (full === old) { mgr.editing = null; renderManagerForm(); return renderManagerList(); }
    if (topics.some((t) => t !== old && sameName(t, full))) {
      return toast('נושא בשם הזה כבר קיים. כדי למזג נושאים, מחק אחד מהם והעבר את הקישורים לשני.');
    }
    safe(async () => {
      if (activeTopic === old) { activeTopic = full; graceTopic = full; }   // keep the same tab selected through the rename
      try {
        await store.applyTopics(topics.map((t) => (t === old ? full : t)), { from: old, to: full });
        const shared = activeShares.find((s) => s.topic === old);
        if (shared) {   // carry the share over to the new name, same link – just relabelled
          const nextShares = activeShares.map((s) => (s.shareId === shared.shareId ? { topic: full, shareId: shared.shareId } : s));
          await store.setShares(nextShares);
          activeShares = nextShares;
          scheduleShareSync();
        }
      }
      finally { graceTopic = null; render(); }
      mgr.editing = null; renderManagerForm(); renderManagerList();
      toast('הנושא עודכן.');
    });
  }
});

el.topicForm.addEventListener('click', (e) => {
  const em = e.target.closest('[data-emoji]');
  if (em) { $('#tfEmoji').value = em.dataset.emoji; return $('#tfName').focus(); }
  if (e.target.closest('[data-tact="cancel-edit"]')) { mgr.editing = null; renderManagerForm(); renderManagerList(); }
});

el.dlgList.addEventListener('click', (e) => {
  const b = e.target.closest('[data-tact]');
  const row = e.target.closest('[data-topic]');
  if (!b || !row) return;
  const t = row.dataset.topic;
  const topics = allTopics();
  const act = b.dataset.tact;

  if (act === 'up' || act === 'down') {
    const i = topics.indexOf(t), j = act === 'up' ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= topics.length) return;
    const next = [...topics];
    [next[i], next[j]] = [next[j], next[i]];
    return safe(() => store.applyTopics(next));
  }
  if (act === 'edit') { mgr = { editing: t, deleting: null, sharing: null }; renderManagerList(); renderManagerForm(); return $('#tfName').focus(); }
  if (act === 'del') { mgr = { editing: null, deleting: t, sharing: null }; renderManagerList(); renderManagerForm(); return; }
  if (act === 'cancel-del') { mgr.deleting = null; return renderManagerList(); }
  if (act === 'confirm-del') {
    const target = ($('#delTarget') || {}).value || '';
    const hasLinks = links.some((l) => l.topic === t);
    const shared = activeShares.find((s) => s.topic === t);
    safe(async () => {
      await store.applyTopics(topics.filter((x) => x !== t), hasLinks ? { from: t, to: target } : null);
      if (shared) {   // the topic is gone, so its share can't stay valid
        await store.setShares(activeShares.filter((s) => s.shareId !== shared.shareId));
        await store.deleteShareSnapshot(shared.shareId);
        delete shareSnapshotCache[shared.shareId];
        activeShares = activeShares.filter((s) => s.shareId !== shared.shareId);
      }
      if (activeTopic === t) resetTopic('all');
      mgr.deleting = null; renderManagerList();
      toast('הנושא נמחק.');
    });
  }

  if (act === 'share') { mgr = { editing: null, deleting: null, sharing: t }; return renderManagerList(); }
  if (act === 'cancel-share') { mgr.sharing = null; return renderManagerList(); }
  if (act === 'copy-share') {
    const box = $('#shareUrlBox');
    return safe(async () => {
      try { await navigator.clipboard.writeText(box.value); toast('הקישור הועתק.'); }
      catch { box.select(); toast('סמן והעתק ידנית (Ctrl+C).'); }
    });
  }
  if (act === 'confirm-share') {
    const shareId = genShareId();
    const snap = buildShareSnapshot(t);
    return safe(async () => {
      await store.setShares([...activeShares, { topic: t, shareId }]);
      shareSnapshotCache[shareId] = JSON.stringify(snap);
      await store.writeShareSnapshot(shareId, t, snap);
      activeShares = [...activeShares, { topic: t, shareId }];
      renderManagerList();
      toast('הנושא שותף.');
    });
  }
  if (act === 'unshare') {
    const entry = activeShares.find((s) => s.topic === t);
    if (!entry) return;
    return safe(async () => {
      await store.setShares(activeShares.filter((s) => s.shareId !== entry.shareId));
      await store.deleteShareSnapshot(entry.shareId);
      delete shareSnapshotCache[entry.shareId];
      activeShares = activeShares.filter((s) => s.shareId !== entry.shareId);
      mgr.sharing = null;
      renderManagerList();
      toast('השיתוף בוטל.');
    });
  }
});

function setViewMode(m) {
  if (m === viewMode) return;
  viewMode = m;
  try { localStorage.setItem('linkbox:view', m); } catch {}
  paintViewToggle();
  renderGrid();
}
el.viewGrid.addEventListener('click', () => setViewMode('grid'));
el.viewList.addEventListener('click', () => setViewMode('list'));
paintViewToggle();

/* Desktop mouse-wheel support for the horizontally-scrolling rows (topics, platforms, tags) –
   touch/trackpad swipe already works everywhere; this adds plain-mouse-wheel support too. */
el.scrollGroup.addEventListener('wheel', (e) => {
  const row = e.target.closest('.no-scrollbar');
  if (!row || row.scrollWidth <= row.clientWidth) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // a trackpad's own horizontal swipe is left alone
  row.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });

/* =====================================================================
   7d. Multi-select: bulk move / bulk delete with undo
   ===================================================================== */
function paintBulkBar() {
  el.bulkBar.classList.toggle('hidden', !selectMode);
  if (!selectMode) return;
  el.bulkCount.textContent = selectedIds.size ? `${selectedIds.size} נבחרו` : 'בחר קישורים לפעולה';
  el.bulkTopic.innerHTML = `<option value="" selected disabled>העבר לנושא…</option>`
    + allTopics().map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join('')
    + `<option value="${NONE}">${NONE_LABEL}</option>`;
  const has = selectedIds.size > 0;
  el.bulkDelete.disabled = !has; el.bulkDelete.style.opacity = has ? '' : '.5';
  el.bulkTopic.disabled = !has; el.bulkTopic.style.opacity = has ? '' : '.5';
}
function setSelectMode(on) {
  selectMode = on;
  if (!on) selectedIds = new Set();
  else editingId = null;   // close any open note/tags editor first, so it isn't stranded with no Save/Cancel row
  el.btnSelect.setAttribute('aria-pressed', String(on));
  renderGrid(); paintBulkBar();
}
el.btnSelect.addEventListener('click', () => setSelectMode(!selectMode));
el.bulkCancel.addEventListener('click', () => setSelectMode(false));

el.bulkTopic.addEventListener('change', () => {
  const v = el.bulkTopic.value;
  if (!v || !selectedIds.size) return;
  const topic = v === NONE ? '' : v;
  const ids = [...selectedIds];
  safe(async () => {
    await Promise.all(ids.map((id) => store.update(id, { topic })));
    toast(`${ids.length} קישורים הועברו ל${topic ? `נושא "${topic}"` : NONE_LABEL}.`);
    setSelectMode(false);
  });
});

el.bulkDelete.addEventListener('click', () => {
  if (!selectedIds.size) return;
  const ids = [...selectedIds];
  const removed = links.filter((l) => ids.includes(l.id));   // snapshot the full link data, for undo
  setSelectMode(false);
  safe(async () => {
    await Promise.all(ids.map((id) => store.remove(id)));
    toast(`${removed.length} קישורים נמחקו.`, {
      label: 'בטל',
      onClick: () => safe(async () => {
        // undo = re-add the same data; it lands as new entries (fresh ids/order), which is normal for this kind of undo
        for (const l of removed) {
          const { id, createdAt, fav, ...rest } = l;
          await store.add(rest);
        }
        toast('השחזור בוצע.');
      }),
    });
  });
});

/* =====================================================================
   7e. Backup: export everything to a JSON file, import it back
   ===================================================================== */
function buildBackupData() {
  return {
    app: 'LinkBox Pro', version: 1, exportedAt: new Date().toISOString(),
    topics: allTopics(),
    links: links.map(({ id, fav, ...rest }) => rest),   // fav is intentionally not restored – see the settings dialog note
  };
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(buildBackupData(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `linkbox-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}
function backupLinkToAdd(raw) {
  if (!raw || typeof raw.url !== 'string' || !safeUrl(raw.url)) return null;
  return {
    url: raw.url,
    title: typeof raw.title === 'string' ? raw.title.slice(0, 300) : hostOf(raw.url),
    description: typeof raw.description === 'string' ? raw.description.slice(0, 500) : '',
    image: safeUrl(raw.image) || '',
    topic: typeof raw.topic === 'string' ? raw.topic : '',
    tags: Array.isArray(raw.tags) ? parseTags(raw.tags.join(',')) : [],
    note: typeof raw.note === 'string' ? raw.note.trim().slice(0, 200) : '',
    done: !!raw.done,
  };
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await readFileAsText(file)); }
  catch { return toast('הקובץ לא תקין (לא JSON).'); }
  const items = Array.isArray(data?.links) ? data.links : Array.isArray(data) ? data : null;
  if (!items) return toast('הקובץ לא בפורמט של גיבוי LinkBox Pro.');

  const newTopics = Array.isArray(data.topics) ? data.topics.filter((t) => typeof t === 'string' && !allTopics().includes(t)) : [];
  if (newTopics.length) await store.applyTopics([...allTopics(), ...newTopics]);
  const topicsNow = newTopics.length ? [...allTopics(), ...newTopics] : allTopics();

  let added = 0, skipped = 0;
  for (const raw of items) {
    const link = backupLinkToAdd(raw);
    if (!link) { skipped++; continue; }
    if (!topicsNow.includes(link.topic)) link.topic = '';
    if (links.some((l) => normalizeForDedupe(l.url) === normalizeForDedupe(link.url))) { skipped++; continue; }
    await store.add(link);
    added++;
  }
  toast(`יובאו ${added} קישורים${skipped ? `, ${skipped} דולגו (כבר קיימים או לא תקינים)` : ''}.`);
}

el.btnSettings.addEventListener('click', () => el.settingsDlg.showModal());
el.settingsDlg.addEventListener('click', (e) => {
  if (e.target === el.settingsDlg || e.target.closest('[data-dlg="close-settings"]')) el.settingsDlg.close();
});
el.btnExport.addEventListener('click', () => safe(async () => exportBackup()));
el.btnImport.addEventListener('click', () => el.importFile.click());
el.importFile.addEventListener('change', () => {
  const file = el.importFile.files[0];
  el.importFile.value = '';
  if (file) safe(() => importBackup(file));
});

/* Theme */
function paintTheme() {
  const dark = document.documentElement.classList.contains('dark');
  el.btnTheme.innerHTML = dark ? ICON.sun : ICON.moon;
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0f1115' : '#f5f6f8';
}
el.btnTheme.addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('linkbox:theme', dark ? 'dark' : 'light'); } catch {}
  paintTheme();
});
paintTheme();

/* =====================================================================
   7c. Shared (read-only) view – rendered instead of the app when the URL has ?share=ID
   ===================================================================== */
async function bootShare(id) {
  const view = document.getElementById('shareView');
  const head = document.getElementById('svHead');
  const grid = document.getElementById('svGrid');
  const empty = document.getElementById('svEmpty');
  const themeBtn = document.getElementById('svTheme');
  view.classList.remove('hidden');

  function paint() { themeBtn.innerHTML = document.documentElement.classList.contains('dark') ? ICON.sun : ICON.moon; }
  themeBtn.addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('linkbox:theme', dark ? 'dark' : 'light'); } catch {}
    paint();
  });
  paint();

  function fail(msg) {
    head.innerHTML = `<h1 class="text-2xl font-bold">LinkBox<span class="mute font-medium"> Pro</span></h1>`;
    grid.innerHTML = '';
    empty.textContent = msg;
    empty.classList.remove('hidden');
  }
  function renderShare(d) {
    empty.classList.add('hidden');
    const items = Array.isArray(d.links) ? d.links : [];
    head.innerHTML = `<h1 class="text-2xl font-bold" dir="auto">${esc(d.topic || 'רשימת קישורים')}</h1>
      <p class="mute mt-1 text-sm">רשימת קישורים משותפת מ-LinkBox Pro · ${items.length} קישורים</p>`;
    if (!items.length) {
      grid.innerHTML = '';
      empty.textContent = 'עדיין אין קישורים ברשימה הזו.';
      empty.classList.remove('hidden');
      return;
    }
    grid.innerHTML = items.map((l) => {
      const p = platformOf(l.url || '');
      const img = safeUrl(l.image);
      return `<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer" class="card block">
        <div class="thumb">
          <div class="ph" style="--c:${p.color}">${esc(p.name.charAt(0))}</div>
          ${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
          <span class="badge"><i style="background:${p.color}"></i>${esc(p.name)}</span>
        </div>
        <div class="px-4 py-3">
          <h3 dir="auto" class="line-clamp-2 font-semibold leading-snug">${esc(l.title || hostOf(l.url || ''))}</h3>
          ${l.description ? `<p dir="auto" class="mute mt-1 line-clamp-2 text-sm">${esc(l.description)}</p>` : ''}
        </div>
      </a>`;
    }).join('');
  }

  head.innerHTML = `<div class="skel h-7 w-48"></div>`;
  grid.innerHTML = Array.from({ length: 3 }, () => `<div class="card"><div class="thumb skel" style="border-radius:0"></div></div>`).join('');

  if (!FIREBASE_READY) return fail('הקישור הזה לא זמין כרגע.');
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    const [appM, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
    const dbRef = F.getFirestore(appM.initializeApp(firebaseConfig));
    F.onSnapshot(F.doc(dbRef, 'sharedTopics', id),
      (snap) => (snap.exists() ? renderShare(snap.data()) : fail('הקישור הזה כבר לא פעיל. אפשר שבעל הרשימה ביטל את השיתוף.')),
      (err) => { console.error(err); fail('לא ניתן לטעון את הרשימה כרגע.'); });
  } catch (err) {
    console.error(err);
    fail('לא ניתן לטעון את הרשימה כרגע.');
  }
}

/* =====================================================================
   8. Boot: Firebase (Google sign-in + Firestore) or local mode
   ===================================================================== */
const shareId = new URLSearchParams(location.search).get('share');

// Arriving from Android's share sheet (installed PWA) or the iOS Shortcut: ?url=/?text=/?title= carries the shared link.
// Captured once, consumed the first time the board finishes loading (see onLinks), then the URL is cleaned up.
let pendingShareTarget = null;
if (!shareId) {
  const qp = new URLSearchParams(location.search);
  if (qp.has('url') || qp.has('text') || qp.has('title')) {
    const m = (qp.get('url') || qp.get('text') || qp.get('title') || '').match(/https?:\/\/[^\s]+/i);
    if (m) pendingShareTarget = m[0];
    history.replaceState(null, '', location.pathname + location.hash);
  }
}

if (shareId) { bootShare(shareId); } else {

function show(name) {
  el.login.classList.toggle('hidden', name !== 'login');
  el.login.classList.toggle('flex', name === 'login');
  el.app.classList.toggle('hidden', name !== 'app');
}

function authMessage(e) {
  switch (e && e.code) {
    case 'auth/popup-closed-by-user':
    case 'auth/cancelled-popup-request': return '';
    case 'auth/popup-blocked': return 'הדפדפן חסם את חלון ההתחברות. אפשר חלונות קופצים ונסה שוב.';
    case 'auth/unauthorized-domain': return 'הדומיין הזה לא מורשה ב-Firebase. הוסף אותו ב-Authentication › Settings › Authorized domains.';
    default: return 'ההתחברות נכשלה. נסה שוב.';
  }
}

let fb = null;
if (FIREBASE_READY) {
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    const [appM, A, F] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js'),
    ]);
    const app = appM.initializeApp(firebaseConfig);
    fb = { auth: A.getAuth(app), db: F.getFirestore(app), A, F };
  } catch (err) {
    console.error(err);
    toast('לא הצלחנו לטעון את Firebase. עובדים במצב מקומי.');
  }
}

if (fb) {
  const provider = new fb.A.GoogleAuthProvider();
  $('#btnGoogle').addEventListener('click', async () => {
    try { await fb.A.signInWithPopup(fb.auth, provider); } catch (e) { toast(authMessage(e)); }
  });
  el.btnUser.addEventListener('click', () => {
    if (confirm('להתנתק מהחשבון?')) fb.A.signOut(fb.auth);
  });
  fb.A.onAuthStateChanged(fb.auth, (user) => {
    pending = null; renderPreview();
    if (!user) { useStore(null); el.btnUser.classList.add('hidden'); return show('login'); }
    el.btnUser.innerHTML = user.photoURL
      ? `<img src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer" class="h-full w-full object-cover">`
      : `<span class="text-sm font-semibold">${esc((user.displayName || '?').charAt(0))}</span>`;
    el.btnUser.classList.remove('hidden');
    useStore(makeCloudStore(fb, user.uid, onLinks, onTopics));
    show('app');
  });
} else {
  el.badge.classList.remove('hidden');
  useStore(makeLocalStore(onLinks, onTopics));
  show('app');
}

} // end of "no ?share= param" branch
</script>
