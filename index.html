<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>LinkBox Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Apply the saved theme before first paint to avoid a flash -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('linkbox:theme');
      var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { fontFamily: { sans: ['Heebo', 'system-ui', 'sans-serif'] } } }
  };
</script>

<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #15181e; --mute: #667085;
    --line: #e2e5ea; --soft: #eceef2; --accent: #4f46e5; --accent-ink: #ffffff;
  }
  .dark {
    --bg: #0f1115; --surface: #171a20; --ink: #eceef2; --mute: #9aa1ad;
    --line: #272b34; --soft: #1f232b; --accent: #8b9cff; --accent-ink: #0f1115;
  }
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); font-family: 'Heebo', system-ui, sans-serif; }
  .mute { color: var(--mute); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  .field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
           padding: .6rem .8rem; color: var(--ink); font: inherit; }
  .field::placeholder { color: var(--mute); }
  .field-sm { width: auto; max-width: 62%; padding: .3rem .5rem; font-size: .8rem; border-radius: 10px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: 12px;
         padding: .6rem 1.1rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; font-family: inherit; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }

  .icon-btn { width: 2.25rem; height: 2.25rem; display: inline-flex; align-items: center; justify-content: center;
              border-radius: 10px; color: var(--mute); border: 1px solid transparent; cursor: pointer; background: transparent; }
  .icon-btn:hover { background: var(--soft); color: var(--ink); }
  .icon-btn[aria-pressed="true"] { color: #f59e0b; }
  .icon-btn svg { width: 1.15rem; height: 1.15rem; }

  .chip { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
          border-radius: 999px; padding: .35rem .85rem; font-size: .875rem; font-weight: 500; cursor: pointer; font-family: inherit; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .count { opacity: .6; font-size: .75rem; margin-inline-start: .3rem; }
  .chip-add { border-style: dashed; color: var(--mute); }

  .card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--soft); overflow: hidden; }
  .thumb img, .thumb .ph { position: absolute; inset: 0; width: 100%; height: 100%; }
  .thumb img { object-fit: cover; }
  .thumb .ph { display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700;
               color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--soft)); }
  .badge { position: absolute; top: .5rem; inset-inline-start: .5rem; display: inline-flex; align-items: center; gap: .35rem;
           background: rgba(15, 17, 21, .74); color: #fff; border-radius: 999px; padding: .15rem .6rem; font-size: .75rem;
           backdrop-filter: blur(6px); }
  .badge i { width: .5rem; height: .5rem; border-radius: 999px; display: inline-block; }

  .skel { background: linear-gradient(90deg, var(--soft), var(--line), var(--soft)); background-size: 200% 100%;
          animation: sh 1.2s linear infinite; border-radius: 8px; }
  @keyframes sh { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>

<body class="min-h-screen antialiased">

<!-- ============ Login ============ -->
<div id="login" class="hidden min-h-screen items-center justify-center px-6">
  <div class="w-full max-w-sm text-center">
    <h1 class="text-4xl font-bold tracking-tight">LinkBox<span class="mute font-medium"> Pro</span></h1>
    <p class="mt-4 mute leading-relaxed">
      כל הקישורים ששמרת מהרשתות במקום אחד – עם תמונה וכותרת, מסודרים לפי נושא ומסונכרנים בין המכשירים.
    </p>
    <button id="btnGoogle" class="btn btn-ghost mt-8 w-full py-3" style="background:var(--surface)">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

<!-- ============ App ============ -->
<div id="app" class="hidden">
  <header class="sticky top-0 z-30 backdrop-blur" style="background: color-mix(in srgb, var(--bg) 85%, transparent); border-bottom: 1px solid var(--line);">
    <div class="mx-auto flex h-14 max-w-5xl items-center gap-3 px-4">
      <div class="text-lg font-bold tracking-tight">LinkBox<span class="mute font-medium"> Pro</span></div>
      <span id="modeBadge" class="hidden rounded-full px-2.5 py-0.5 text-xs font-medium" style="background: var(--soft); color: var(--mute);"
            title="Firebase לא מוגדר, הקישורים נשמרים רק בדפדפן הזה">מצב מקומי</span>
      <div class="flex-1"></div>
      <button id="btnTheme" class="icon-btn" aria-label="החלף מצב כהה/בהיר"></button>
      <button id="btnUser" class="hidden h-9 w-9 overflow-hidden rounded-full" style="border:1px solid var(--line)" aria-label="התנתק"></button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 pb-24 pt-6">
    <form id="addForm" class="flex gap-2">
      <input id="urlInput" class="field h-14 flex-1 text-base" dir="auto" type="text" inputmode="url"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="הדבק קישור מאינסטגרם, טיקטוק, יוטיוב או כתבה" aria-label="קישור לשמירה">
      <button id="btnAdd" type="submit" class="btn btn-primary h-14 px-6 text-base">הוסף</button>
    </form>

    <section id="previewPanel" class="mt-4 hidden" aria-live="polite"></section>

    <div class="mt-8 space-y-3">
      <input id="search" class="field" type="search" placeholder="חפש בכותרות, בתיאורים ובכתובות" aria-label="חיפוש">
      <nav id="tabs" class="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 pb-1" aria-label="נושאים"></nav>
    </div>

    <section id="grid" class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>
    <p id="empty" class="mute hidden py-16 text-center"></p>
  </main>
</div>

<div id="toast" class="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex justify-center px-4"
     style="padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));" role="status"></div>

<script type="module">
/* =====================================================================
   1. Firebase config – paste yours here (see README.md).
      While it still says YOUR_..., the app runs locally on localStorage.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCbhE_tGUCT3SPzQvCi5XPMy43hed1gDW8",
  authDomain: "linkbox-pro.firebaseapp.com",
  projectId: "linkbox-pro",
  storageBucket: "linkbox-pro.firebasestorage.app",
  messagingSenderId: "894231141445",
  appId: "1:894231141445:web:aba450de4fbc0dc986172c"
};
const FIREBASE_READY = !/^YOUR_/.test(firebaseConfig.apiKey);

/* =====================================================================
   2. Helpers
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : '');
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const DEFAULT_TOPICS = ['🎸 גיטרה', '🎵 שירים ללמוד', '🎙️ ציוד', '💡 רעיונות', '🔥 השראה'];

const PLATFORMS = [
  { re: /(^|\.)youtube\.com$|^youtu\.be$/, name: 'YouTube', color: '#ef4444' },
  { re: /(^|\.)instagram\.com$/, name: 'Instagram', color: '#ec4899' },
  { re: /(^|\.)tiktok\.com$/, name: 'TikTok', color: '#14b8a6' },
  { re: /(^|\.)(x|twitter)\.com$/, name: 'X', color: '#71717a' },
  { re: /(^|\.)facebook\.com$|^fb\.watch$/, name: 'Facebook', color: '#3b82f6' },
  { re: /(^|\.)reddit\.com$/, name: 'Reddit', color: '#f97316' },
  { re: /(^|\.)spotify\.com$/, name: 'Spotify', color: '#22c55e' },
];
function platformOf(url) {
  const h = hostOf(url);
  return PLATFORMS.find((p) => p.re.test(h)) || { name: h || 'קישור', color: '#6366f1' };
}

const ICON = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5z"/></svg>',
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
};

const el = {
  login: $('#login'), app: $('#app'), grid: $('#grid'), tabs: $('#tabs'), empty: $('#empty'),
  form: $('#addForm'), url: $('#urlInput'), btnAdd: $('#btnAdd'), panel: $('#previewPanel'),
  search: $('#search'), badge: $('#modeBadge'), btnUser: $('#btnUser'), btnTheme: $('#btnTheme'), toast: $('#toast'),
};

let toastTimer;
function toast(msg) {
  if (!msg) return;
  el.toast.innerHTML = `<div class="rounded-xl px-4 py-2.5 text-sm font-medium shadow-lg" style="background:var(--ink);color:var(--bg)">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.toast.innerHTML = ''), 3800);
}
async function safe(fn) {
  try { await fn(); } catch (e) { console.error(e); toast('משהו השתבש. נסה שוב.'); }
}

/* =====================================================================
   3. State
   ===================================================================== */
let store = null;          // current data layer (local or cloud)
let links = [];            // newest first
let customTopics = [];     // topics the user created
let loaded = false;
let activeTopic = 'all';   // 'all' | 'fav' | <topic name>
let searchText = '';
let pending = null;        // link being previewed before save
let busy = false;

const allTopics = () => {
  const out = [...DEFAULT_TOPICS];
  for (const t of [...customTopics, ...links.map((l) => l.topic)]) if (t && !out.includes(t)) out.push(t);
  return out;
};
const defaultTopic = () => (allTopics().includes(activeTopic) ? activeTopic : DEFAULT_TOPICS[0]);

/* =====================================================================
   4. Data layers – same interface: start / stop / add / update / remove / addTopic
   ===================================================================== */
function makeLocalStore(onLinks, onTopics) {
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
  let list = read('linkbox:links');
  let topics = read('linkbox:topics');
  const persist = () => {
    try { localStorage.setItem('linkbox:links', JSON.stringify(list)); localStorage.setItem('linkbox:topics', JSON.stringify(topics)); } catch {}
    onLinks([...list].sort((a, b) => b.createdAt - a.createdAt));
  };
  return {
    start() { persist(); onTopics(topics); },
    stop() {},
    async add(l) { list.push({ ...l, fav: false, id: uid8(), createdAt: Date.now() }); persist(); },
    async update(id, patch) { list = list.map((x) => (x.id === id ? { ...x, ...patch } : x)); persist(); },
    async remove(id) { list = list.filter((x) => x.id !== id); persist(); },
    async addTopic(t) { if (!topics.includes(t)) { topics.push(t); persist(); onTopics(topics); } },
  };
}

function makeCloudStore(fb, uid, onLinks, onTopics) {
  const { db, F } = fb;
  let unsubLinks = () => {};
  let unsubTopics = () => {};
  const toList = (snap) =>
    snap.docs
      .map((d) => { const x = d.data(); return { id: d.id, ...x, createdAt: x.createdAt?.toMillis?.() ?? Date.now() }; })
      .sort((a, b) => b.createdAt - a.createdAt);

  return {
    start() {
      const col = F.collection(db, 'links');
      const plain = F.query(col, F.where('uid', '==', uid));
      const ordered = F.query(col, F.where('uid', '==', uid), F.orderBy('createdAt', 'desc'));
      const onErr = (e) => {
        console.error(e);
        toast(e.code === 'permission-denied' ? 'אין הרשאה לקרוא נתונים. בדוק את חוקי Firestore (ראה README).' : 'טעינת הקישורים נכשלה.');
      };
      unsubLinks = F.onSnapshot(ordered, (s) => onLinks(toList(s)), (e) => {
        if (e.code === 'failed-precondition') {
          // Composite index missing – keep working (sorted on the client) and print the index link in the console.
          console.warn('Missing Firestore index (uid + createdAt). Create it with the link below:', e.message);
          unsubLinks = F.onSnapshot(plain, (s) => onLinks(toList(s)), onErr);
        } else onErr(e);
      });
      unsubTopics = F.onSnapshot(F.doc(db, 'users', uid), (s) => onTopics((s.data() || {}).topics || []), (e) => console.warn(e));
    },
    stop() { unsubLinks(); unsubTopics(); },
    async add(l) { await F.addDoc(F.collection(db, 'links'), { uid, ...l, fav: false, createdAt: F.serverTimestamp() }); },
    async update(id, patch) { await F.updateDoc(F.doc(db, 'links', id), patch); },
    async remove(id) { await F.deleteDoc(F.doc(db, 'links', id)); },
    async addTopic(t) { await F.setDoc(F.doc(db, 'users', uid), { topics: F.arrayUnion(t) }, { merge: true }); },
  };
}

function useStore(s) {
  if (store) store.stop();
  store = s;
  links = []; customTopics = []; loaded = false;
  render();
  if (s) s.start();
}
const onLinks = (list) => { links = list; loaded = true; render(); };
const onTopics = (list) => { customTopics = list; renderTabs(); };

/* =====================================================================
   5. Rendering
   ===================================================================== */
function render() { renderTabs(); renderGrid(); }

function renderTabs() {
  const counts = {};
  links.forEach((l) => (counts[l.topic] = (counts[l.topic] || 0) + 1));
  const tabs = [
    { k: 'all', label: 'הכל', n: links.length },
    { k: 'fav', label: '★ מועדפים', n: links.filter((l) => l.fav).length },
    ...allTopics().map((t) => ({ k: t, label: t, n: counts[t] || 0 })),
  ];
  el.tabs.innerHTML =
    tabs.map((t) => `<button class="chip" data-tab="${esc(t.k)}" aria-pressed="${t.k === activeTopic}">${esc(t.label)}<span class="count">${t.n}</span></button>`).join('') +
    `<button class="chip chip-add" data-act="addTopic">+ נושא</button>`;
}

function cardHTML(l) {
  const p = platformOf(l.url);
  const img = safeUrl(l.image).replace(/^http:/i, 'https:');
  const topicOptions = allTopics().map((t) => `<option value="${esc(t)}"${t === l.topic ? ' selected' : ''}>${esc(t)}</option>`).join('');
  return `
<article class="card flex flex-col" data-id="${esc(l.id)}">
  <a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer" class="block flex-1">
    <div class="thumb">
      <div class="ph" style="--c:${p.color}">${esc(p.name.charAt(0))}</div>
      ${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      <span class="badge"><i style="background:${p.color}"></i>${esc(p.name)}</span>
    </div>
    <div class="px-4 pt-3">
      <h3 dir="auto" class="line-clamp-2 font-semibold leading-snug">${esc(l.title || hostOf(l.url))}</h3>
      ${l.description ? `<p dir="auto" class="mute mt-1 line-clamp-2 text-sm">${esc(l.description)}</p>` : ''}
    </div>
  </a>
  <div class="flex items-center gap-1 px-3 py-3">
    <select class="field field-sm" data-act="topic" aria-label="נושא">${topicOptions}</select>
    <span class="flex-1"></span>
    <button class="icon-btn" data-act="fav" aria-pressed="${!!l.fav}" aria-label="${l.fav ? 'הסר ממועדפים' : 'הוסף למועדפים'}">${l.fav ? ICON.starOn : ICON.star}</button>
    <button class="icon-btn" data-act="del" aria-label="מחק קישור">${ICON.trash}</button>
  </div>
</article>`;
}

function renderGrid() {
  if (!loaded) {
    el.empty.classList.add('hidden');
    el.grid.innerHTML = Array.from({ length: 3 }, () =>
      `<div class="card"><div class="thumb skel" style="border-radius:0"></div><div class="space-y-2 p-4"><div class="skel h-4 w-3/4"></div><div class="skel h-3 w-full"></div></div></div>`).join('');
    return;
  }
  const q = searchText.trim().toLowerCase();
  const shown = links.filter((l) => {
    if (activeTopic === 'fav' && !l.fav) return false;
    if (activeTopic !== 'all' && activeTopic !== 'fav' && l.topic !== activeTopic) return false;
    return !q || [l.title, l.description, l.url, l.topic].some((v) => (v || '').toLowerCase().includes(q));
  });
  el.grid.innerHTML = shown.map(cardHTML).join('');
  el.empty.classList.toggle('hidden', shown.length > 0);
  el.empty.textContent = links.length === 0
    ? 'עוד אין קישורים. הדבק קישור בשדה למעלה כדי לשמור את הראשון.'
    : 'לא נמצאו קישורים שמתאימים לסינון.';
}

function renderPreview() {
  if (!pending) { el.panel.classList.add('hidden'); el.panel.innerHTML = ''; return; }
  el.panel.classList.remove('hidden');

  if (pending.loading) {
    el.panel.innerHTML = `
      <div class="panel sm:flex">
        <div class="thumb skel sm:w-72" style="border-radius:0"></div>
        <div class="flex-1 space-y-3 p-4"><div class="skel h-5 w-2/3"></div><div class="skel h-3 w-full"></div><div class="skel h-3 w-1/2"></div>
        <p class="mute text-sm">טוען תצוגה מקדימה…</p></div>
      </div>`;
    return;
  }

  const p = platformOf(pending.url);
  const img = safeUrl(pending.image).replace(/^http:/i, 'https:');
  const options = allTopics().map((t) => `<option value="${esc(t)}"${t === pending.topic ? ' selected' : ''}>${esc(t)}</option>`).join('');
  el.panel.innerHTML = `
    <div class="panel sm:flex">
      <div class="thumb sm:w-72 sm:flex-none" style="border-radius:0">
        <div class="ph" style="--c:${p.color}">${esc(p.name.charAt(0))}</div>
        ${img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
        <span class="badge"><i style="background:${p.color}"></i>${esc(p.name)}</span>
      </div>
      <div class="flex-1 space-y-3 p-4">
        <input id="pvTitle" class="field font-semibold" dir="auto" value="${esc(pending.title)}" aria-label="כותרת">
        <textarea id="pvDesc" class="field text-sm" dir="auto" rows="2" aria-label="תיאור">${esc(pending.description)}</textarea>
        ${pending.weak ? '<p class="mute text-sm">לא הצלחנו למשוך תצוגה מלאה מהאתר. אפשר לשמור עם כותרת שתכתוב בעצמך.</p>' : ''}
        <div class="flex flex-wrap items-center gap-2">
          <select id="pvTopic" class="field field-sm" aria-label="נושא">${options}</select>
          <span class="flex-1"></span>
          <button type="button" class="btn btn-ghost" data-act="cancel">ביטול</button>
          <button type="button" class="btn btn-primary" data-act="save">שמור</button>
        </div>
      </div>
    </div>`;
}

/* =====================================================================
   6. Adding a link
   ===================================================================== */
async function fetchPreview(url) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch('/.netlify/functions/preview?url=' + encodeURIComponent(url), { signal: ctl.signal });
    if (!r.ok) throw new Error('preview http ' + r.status);
    if (!(r.headers.get('content-type') || '').includes('json')) throw new Error('preview is not json'); // plain static server
    return await r.json();
  } finally { clearTimeout(timer); }
}

el.form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy || !store) return;
  const raw = el.url.value.trim();
  if (!raw) return;

  // Share sheets often paste "text + link" – take the first URL in the text.
  let url = (raw.match(/https?:\/\/[^\s]+/i) || [raw])[0];
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try {
    const u = new URL(url);
    if (!u.hostname.includes('.')) throw new Error('bad host');
    url = u.href;
  } catch { return toast('הקישור לא נראה תקין. בדוק ונסה שוב.'); }

  if (links.some((l) => l.url === url)) return toast('הקישור הזה כבר שמור אצלך.');

  busy = true; el.btnAdd.disabled = true;
  pending = { loading: true, url };
  renderPreview();
  try {
    const d = await fetchPreview(url);
    pending = {
      url, title: d.title || hostOf(url), description: d.description || '', image: d.image || '',
      topic: defaultTopic(), weak: d.source === 'fallback',
    };
  } catch (err) {
    console.warn('preview failed:', err);
    pending = { url, title: hostOf(url), description: '', image: '', topic: defaultTopic(), weak: true };
  }
  busy = false; el.btnAdd.disabled = false;
  renderPreview();
});

el.panel.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || !pending) return;
  if (b.dataset.act === 'cancel') { pending = null; renderPreview(); }
  if (b.dataset.act === 'save') safe(async () => {
    const link = {
      url: pending.url,
      title: $('#pvTitle').value.trim() || hostOf(pending.url),
      description: $('#pvDesc').value.trim(),
      image: pending.image,
      topic: $('#pvTopic').value,
    };
    await store.add(link);
    pending = null; el.url.value = '';
    renderPreview();
    toast('נשמר.');
  });
});

/* =====================================================================
   7. Board interactions
   ===================================================================== */
el.grid.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.closest('[data-id]').dataset.id;
  if (b.dataset.act === 'fav') {
    const l = links.find((x) => x.id === id);
    if (l) safe(() => store.update(id, { fav: !l.fav }));
  }
  if (b.dataset.act === 'del' && confirm('למחוק את הקישור?')) safe(() => store.remove(id));
});
el.grid.addEventListener('change', (e) => {
  const s = e.target.closest('select[data-act="topic"]');
  if (s) safe(() => store.update(s.closest('[data-id]').dataset.id, { topic: s.value }));
});

el.tabs.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.act === 'addTopic') {
    const name = (prompt('שם הנושא החדש (אפשר להתחיל באימוג׳י)') || '').trim().slice(0, 40);
    if (!name) return;
    if (allTopics().includes(name)) { activeTopic = name; return render(); }
    safe(async () => { await store.addTopic(name); activeTopic = name; render(); });
    return;
  }
  if (b.dataset.tab !== undefined) { activeTopic = b.dataset.tab; render(); }
});

el.search.addEventListener('input', () => { searchText = el.search.value; renderGrid(); });

/* Theme */
function paintTheme() {
  const dark = document.documentElement.classList.contains('dark');
  el.btnTheme.innerHTML = dark ? ICON.sun : ICON.moon;
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0f1115' : '#f5f6f8';
}
el.btnTheme.addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('linkbox:theme', dark ? 'dark' : 'light'); } catch {}
  paintTheme();
});
paintTheme();

/* =====================================================================
   8. Boot: Firebase (Google sign-in + Firestore) or local mode
   ===================================================================== */
function show(name) {
  el.login.classList.toggle('hidden', name !== 'login');
  el.login.classList.toggle('flex', name === 'login');
  el.app.classList.toggle('hidden', name !== 'app');
}

function authMessage(e) {
  switch (e && e.code) {
    case 'auth/popup-closed-by-user':
    case 'auth/cancelled-popup-request': return '';
    case 'auth/popup-blocked': return 'הדפדפן חסם את חלון ההתחברות. אפשר חלונות קופצים ונסה שוב.';
    case 'auth/unauthorized-domain': return 'הדומיין הזה לא מורשה ב-Firebase. הוסף אותו ב-Authentication › Settings › Authorized domains.';
    default: return 'ההתחברות נכשלה. נסה שוב.';
  }
}

let fb = null;
if (FIREBASE_READY) {
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    const [appM, A, F] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js'),
    ]);
    const app = appM.initializeApp(firebaseConfig);
    fb = { auth: A.getAuth(app), db: F.getFirestore(app), A, F };
  } catch (err) {
    console.error(err);
    toast('לא הצלחנו לטעון את Firebase. עובדים במצב מקומי.');
  }
}

if (fb) {
  const provider = new fb.A.GoogleAuthProvider();
  $('#btnGoogle').addEventListener('click', async () => {
    try { await fb.A.signInWithPopup(fb.auth, provider); } catch (e) { toast(authMessage(e)); }
  });
  el.btnUser.addEventListener('click', () => {
    if (confirm('להתנתק מהחשבון?')) fb.A.signOut(fb.auth);
  });
  fb.A.onAuthStateChanged(fb.auth, (user) => {
    pending = null; renderPreview();
    if (!user) { useStore(null); el.btnUser.classList.add('hidden'); return show('login'); }
    el.btnUser.innerHTML = user.photoURL
      ? `<img src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer" class="h-full w-full object-cover">`
      : `<span class="text-sm font-semibold">${esc((user.displayName || '?').charAt(0))}</span>`;
    el.btnUser.classList.remove('hidden');
    useStore(makeCloudStore(fb, user.uid, onLinks, onTopics));
    show('app');
  });
} else {
  el.badge.classList.remove('hidden');
  useStore(makeLocalStore(onLinks, onTopics));
  show('app');
}
</script>
</body>
